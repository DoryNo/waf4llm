name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev,dashboard]"
      - name: Ruff lint
        run: ruff check src tests benchmarks dashboard
      - name: Ruff format check
        run: ruff format --check src tests benchmarks dashboard
      - name: Mypy
        run: mypy --check-untyped-defs src
      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t waf-proxy:ci .
