[project]
name = "llm-waf-proxy"
version = "0.1.0"
description = "WAF for LLM — Anti-Injection Proxy with graduated response"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "redis>=5.2",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "structlog>=24.4",
    "python-json-logger>=3.2",
    "orjson>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "sentence-transformers>=3.2",
    "onnxruntime>=1.19",
    "captum>=0.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-redis>=4.6",
]
dashboard = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "psycopg2-binary>=2.9; sys_platform != 'win32' or python_version < '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = ["alembic", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.alembic]
script_location = "alembic"
